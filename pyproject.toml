[project]
name = "mini-claude-code"
version = "0.1.0"
description = "Basic agent loop: conversational implementation."
readme = "README.md"
authors = [
    { name = "Pritam", email = "pritam.100x@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mini-claude-code = "mini_claude_code.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
